# Supported Shiny Server syntax. Run under the intended R service account.
run_as :PROCESS_USER:;
app_init_timeout 90;
app_idle_timeout 60;
sanitize_errors on;

server {
  listen 3838 127.0.0.1;
  location / {
    site_dir .;
    directory_index on;
  }
  location /old-hello {
    redirect /hello/ 302 true;
  }
}
