# Keep the original shiny-server.conf on the unchanged upstream server.
# Backend paths are forwarded unchanged, not stripped or translated.
listen = "127.0.0.1:8080"
admin_listen = "127.0.0.1:8081"
state_dir = "../.harbor-upstream"

[[upstreams]]
name = "existing-shiny-server"
mount = "/"
backends = ["http://127.0.0.1:3838"]
