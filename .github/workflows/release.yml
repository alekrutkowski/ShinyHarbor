name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag, version and compatibility policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_gate.py --tag "$RELEASE_TAG"
  verified-build:
    needs: policy
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: verified-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Require every architecture, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python tools/release_files.py --directory dist
          cd dist && sha256sum -c SHA256SUMS && cd ..
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "ShinyHarbor $TAG" --notes-file docs/RELEASE_NOTES.md "${flags[@]}"
