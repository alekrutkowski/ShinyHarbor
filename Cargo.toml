[package]
name = "shinyharbor"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
authors = ["Alek Rutkowski <alek.rutkowski@gmail.com>"]
license = "MIT"
description = "A portable Rust gateway and native process host for R Shiny applications"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["http1", "http2", "json", "tokio", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
handlebars = { version = "6", default-features = false }
http = "1.3"
http-body = "1.0"
hyper = { version = "1.7", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
ipnet = { version = "2.11", features = ["serde"] }
percent-encoding = "2.3"
maxminddb = "0.32"
process-wrap = { version = "10.0", features = ["tokio1"] }
rand = "0.8"
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15.3", default-features = false, features = ["axum", "ring", "tls12", "webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1.47", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
tempfile = "3.22"
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "compression-deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[target.'cfg(unix)'.dependencies]
hyperlocal = { version = "0.9.1", default-features = false, features = ["client"] }
nix = { version = "0.31", features = ["user", "fs"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
await_holding_lock = "deny"
